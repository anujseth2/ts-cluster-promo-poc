# Content assignment sweep: configuration.
#
# Make one copy per cluster, because the group's name differs between them, for example
# sweep-dev.yaml and sweep-test.yaml, and fill in the <...> values in each. Credentials never go
# in this file; set them in the environment (see README.md).

# Access added on the content in scope (models, liveboards, answers). MODIFY is edit.
content_level: MODIFY
# Access added on the tables under that content. MODIFY, because every promotion re-imports
# its tables and updating a table needs edit on it.
table_level: MODIFY

# Content by these authors is never touched. "system" is ThoughtSpot's own content.
exclude_authors: [system]

# Where each run writes its report (CSV) and audit record (JSON).
audit_dir: sweep_audit

scopes:
  - name: Test run
    # The sweep tool group on this cluster, exactly as named in Admin > Groups.
    group: "<sweep tool group name>"
    # Pick the content by who created it: by username, or by a group the authors belong to.
    # Keep the line you need and delete the other (or keep both to include either).
    authors: ["<author's ThoughtSpot username>"]
    author_groups: ["<group whose members' content to include>"]
